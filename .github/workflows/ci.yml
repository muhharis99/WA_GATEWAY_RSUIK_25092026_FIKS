name: CI

permissions:
  contents: write

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  node-static:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Generate dependency lockfiles
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          set -e
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          composer update --no-interaction --no-install --prefer-dist

          git add package-lock.json composer.lock

          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: lock Node and PHP dependencies"
            git push
          fi

      - name: Node syntax check
        run: npm run check

      - name: Node contract test
        run: npm run test:contract

      - name: jQuery frontend contract
        run: npm run test:jquery

      - name: Composer dependency check
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: PHP syntax check
        shell: bash
        run: |
          set -e
          find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: PHP architecture guard
        shell: bash
        run: |
          set -e
          test -f app/Config/config.php
          test -f app/Database/db.php
          test -f app/Support/functions.php
          test -f app/Support/report_functions.php
          test ! -f config.php
          test ! -f db.php
          test ! -f functions.php
          test ! -f report_functions.php
          test ! -f test.txt

      - name: Runtime architecture guard
        shell: bash
        run: |
          set -e
          test "$(node -p "require('./package.json').scripts.start")" = "node src/entrypoints/reminder.js"
          test "$(node -p "require('./package.json').scripts['start:lab']")" = "node src/entrypoints/lab.js"
          test "$(node -p "require('./package.json').scripts['start:ijin']")" = "node src/entrypoints/ijin.js"
          test "$(node -p "require('./package.json').scripts['start:alternatif']")" = "node src/entrypoints/alternatif.js"

      - name: Secret file guard
        run: |
          test ! -f .env
          test ! -d .wwebjs_auth
          test ! -d .wwebjs_auth_lab
          test ! -d .wwebjs_auth_ijin
